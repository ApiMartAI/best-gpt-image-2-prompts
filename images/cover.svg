<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" width="1440" height="420" role="img" aria-label="best-gpt-image-2-prompts cover">
  <defs>
    <!-- 背景：深绿调，贴合品牌主色 #216D51 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08140f"/>
      <stop offset="100%" stop-color="#122420"/>
    </linearGradient>

    <!-- 顶部 accent 渐变线：品牌绿 → 亮绿 → 冷蓝 -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#216D51"/>
      <stop offset="50%" stop-color="#3d9e7c"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>

    <!-- 左侧光晕：品牌绿发散 -->
    <radialGradient id="glow" cx="0.2" cy="0.55" r="0.4">
      <stop offset="0%" stop-color="#216D51" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#216D51" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景层 -->
  <rect width="1440" height="420" fill="url(#bg)"/>
  <rect width="1440" height="420" fill="url(#glow)"/>

  <!-- 顶部 accent 线 -->
  <rect x="0" y="0" width="1440" height="3" fill="url(#accent)"/>

  <!-- APIMart logo：嵌套 svg 以保留原 viewBox -->
  <svg x="140" y="125" width="170" height="170" viewBox="480 470 1100 1100">
    <path fill="#ffffff" d="M 508 528 L 509 1514 L 586 1514 L 588 1512 L 587 610 L 589 607 L 670 607 L 1022 1009 L 1027 1007 L 1388 607 L 1467 607 L 1469 609 L 1470 738 L 1469 1513 L 1551 1513 L 1551 528 L 1350 528 L 1026 901 L 841 687 L 707 528 Z"/>
    <path fill="#ffffff" d="M 627 646 L 626 1513 L 699 1513 L 700 785 L 1008 1131 L 1025 1147 L 1359 781 L 1360 1513 L 1434 1514 L 1435 646 L 1394 647 L 1240 821 L 1024 1059 L 1009 1045 L 789 795 L 661 646 Z"/>
    <path fill="#ffffff" d="M 732 872 L 732 1513 L 802 1514 L 805 1512 L 805 1052 L 888 1145 L 1024 1293 L 1250 1047 L 1250 1513 L 1322 1514 L 1324 1512 L 1323 872 L 1304 890 L 1026 1196 L 1021 1195 Z"/>
  </svg>

  <!-- APIMart 品牌字 -->
  <text x="225" y="330" text-anchor="middle" fill="#cbd5e1"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="600" letter-spacing="6">APIMART</text>

  <!-- 竖向分隔线 -->
  <line x1="360" y1="140" x2="360" y2="300" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- 主标题 -->
  <text x="400" y="190" fill="#ffffff"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="48" font-weight="700">best-gpt-image-2-prompts</text>

  <!-- 副标题 -->
  <text x="400" y="232" fill="#94a3b8"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400">A curated gallery of high-quality GPT-Image-2 prompts</text>

  <!-- Stats 胶囊：品牌绿为主，蓝/金作为副色平衡 -->
  <g transform="translate(400, 268)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <g>
      <rect x="0" y="0" width="104" height="30" rx="15" fill="#216D51" fill-opacity="0.20" stroke="#3d9e7c" stroke-opacity="0.6"/>
      <text x="52" y="20" text-anchor="middle" fill="#6ee7b7">107 CASES</text>
    </g>
    <g transform="translate(116, 0)">
      <rect x="0" y="0" width="124" height="30" rx="15" fill="#3a86ff" fill-opacity="0.14" stroke="#3a86ff" stroke-opacity="0.45"/>
      <text x="62" y="20" text-anchor="middle" fill="#3a86ff">5 CATEGORIES</text>
    </g>
    <g transform="translate(252, 0)">
      <rect x="0" y="0" width="104" height="30" rx="15" fill="#ffd166" fill-opacity="0.14" stroke="#ffd166" stroke-opacity="0.45"/>
      <text x="52" y="20" text-anchor="middle" fill="#ffd166">CC BY 4.0</text>
    </g>
  </g>

  <!-- 底部 APIMart 品牌署名 -->
  <text x="720" y="398" text-anchor="middle" fill="#64748b"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500" letter-spacing="2">
    POWERED BY APIMART  ·  apimart.ai
  </text>

  <!-- 右侧画廊意象：4x3 小卡片，以绿色为主调，蓝/金作点缀 -->
  <g transform="translate(1080, 95)">
    <!-- Row 1：饱和度最高 -->
    <rect x="0"   y="0"   width="62" height="82" rx="6" fill="#216D51" fill-opacity="0.85"/>
    <rect x="70"  y="0"   width="62" height="82" rx="6" fill="#3d9e7c" fill-opacity="0.85"/>
    <rect x="140" y="0"   width="62" height="82" rx="6" fill="#ffd166" fill-opacity="0.70"/>
    <rect x="210" y="0"   width="62" height="82" rx="6" fill="#3a86ff" fill-opacity="0.70"/>
    <!-- Row 2：中等透明度 -->
    <rect x="0"   y="90"  width="62" height="82" rx="6" fill="#6ee7b7" fill-opacity="0.55"/>
    <rect x="70"  y="90"  width="62" height="82" rx="6" fill="#216D51" fill-opacity="0.60"/>
    <rect x="140" y="90"  width="62" height="82" rx="6" fill="#3d9e7c" fill-opacity="0.50"/>
    <rect x="210" y="90"  width="62" height="82" rx="6" fill="#3a86ff" fill-opacity="0.40"/>
    <!-- Row 3：淡化 -->
    <rect x="0"   y="180" width="62" height="82" rx="6" fill="#216D51" fill-opacity="0.30"/>
    <rect x="70"  y="180" width="62" height="82" rx="6" fill="#3d9e7c" fill-opacity="0.25"/>
    <rect x="140" y="180" width="62" height="82" rx="6" fill="#6ee7b7" fill-opacity="0.20"/>
    <rect x="210" y="180" width="62" height="82" rx="6" fill="#ffd166" fill-opacity="0.20"/>
  </g>
</svg>
